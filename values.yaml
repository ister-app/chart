# Default values for the ister chart.
#
# These defaults are deliberately neutral: they deploy a self-contained ister
# (embedded PostgreSQL, RabbitMQ subchart, Typesense) with no ingress and no
# media volumes. See values-dev.yaml and values-production.yaml for real setups.
#
# Nothing in this file is a secret. Provide secrets with an existingSecret
# reference, or via a secret manager — never by committing them here.

nameOverride: ""
fullnameOverride: ""

global:
  # Prefix for every image repository, for a registry mirror or an air-gapped cluster,
  # e.g. "harbor.example.com/proxy/". Applied to all images the chart deploys.
  imageRegistry: ""

# Labels added to every resource the chart creates.
commonLabels: {}

# Applied to every pod. The website image (Forgejo) may need one.
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ============================================================
# Server (Spring Boot backend)
# ============================================================
server:
  # Display name of this instance. Also the first line of /.well-known/ister, and the
  # node name in a multi-node setup.
  name: Ister
  # Name of the whole ister cluster as shown to clients; empty = server.name. Set it when
  # you add helper nodes (below) so the pods share one cluster identity.
  clusterName: ""

  image:
    repository: ghcr.io/ister-app/server
    # Renovate keeps this tag current — see renovate.json. Now that the server repo publishes
    # semver tags, Renovate bumps this from here. Empty falls back to .Chart.AppVersion.
    # Set a digest for a reproducible rollback.
    #
    # 3.0.0 is the floor for this chart's own e2e, not just a routine bump: it renamed the
    # admin mutation scanLibrary to scanLibraries, which ci/e2e/10-scan.sh drives the scan
    # with. Deploying an older server here makes that scenario fail on an undefined field.
    tag: "3.4.1"
    digest: ""
    pullPolicy: IfNotPresent

  # The cache volume is ReadWriteOnce, so >1 replica cannot schedule.
  # The chart fails the render if you raise this without switching to RWX.
  replicaCount: 1

  contextPath: /api

  # Public base URL of the API. Empty = derived from the ingress host + contextPath.
  url: ""

  oidc:
    # OIDC issuer, e.g. https://keycloak.example.com/realms/auth
    url: ""

  # TMDB API key. Rendered into a Secret, not into the pod spec.
  # Prefer existingSecret (key: tmdb-api-key) over putting the key in values.
  tmdbApiKey: ""
  existingSecret: ""

  managementPort: 8081

  # Spring's ${TYPESENSE_PORT:8108} placeholder collides with the Docker-style
  # service-link env var Kubernetes injects for the typesense Service.
  # Keep this false or the server will fail to start once Typesense exists.
  enableServiceLinks: false

  # App-wide language tags (ISO-639-1, comma separated); empty = the server default (en,nl).
  languages: ""
  # Extra origins allowed on the GraphQL websocket handshake, comma separated ("*" = any),
  # on top of the public host derived from the server URL.
  websocketAllowedOrigins: ""

  # Base URLs of the external metadata sources, for a proxy, a mirror or an air-gapped
  # cluster. Empty = the real service. (ci/values-ci.yaml points them all at WireMock.)
  externalServices:
    tmdbApiUrl: ""
    tmdbImageBase: ""
    musicbrainzBase: ""
    coverArtReleaseBase: ""
    coverArtReleaseGroupBase: ""
    commonsFilepathBase: ""
    openLibraryBase: ""
    openLibraryCoversBase: ""
    openLibraryAuthorPhotoBase: ""
    wikidataEntityBase: ""
    wikidataApiBase: ""
    wikipediaSummaryTemplate: ""
    itunesBase: ""

  # Hardware video encoding for the HLS transcoder. type: none | vaapi | nvdec.
  # The pod needs the GPU too; either via a device plugin resource (recommended, no
  # privileges: intel-device-plugins, the AMD GPU device plugin, the NVIDIA device
  # plugin, or squat's generic-device-plugin for /dev/dri) or via hostPath on the device
  # file, which the device cgroup only allows for a privileged container.
  hwaccel:
    type: none
    device: /dev/dri/renderD128
    # Device plugin resources added to the container limits,
    # e.g. {gpu.intel.com/i915: 1}, {amd.com/gpu: 1}, {nvidia.com/gpu: 1}, {squat.ai/dri: 1}.
    resources: {}
    # Mount hwaccel.device from the node as a hostPath instead. Requires privileged.
    hostPath: false
    privileged: false
    # Groups that may open the device on the node, e.g. [44, 105] (video, render).
    supplementalGroups: []

  # This node helping other nodes (a multi-node cluster, see the server docs, chapter
  # Multi-node): the directory names of another node it consumes work for.
  helper:
    disks: []
    # - name: nas-shows
    #   jobs: [TRANSCODE, DETECT_SEGMENTS, SUBTITLES]   # empty = helper.jobs
    # Default job set for disks without their own; empty = all three.
    jobs: []
    # Job families this node does NOT run for its own directories, leaving them to
    # helpers (below or elsewhere): TRANSCODE, DETECT_SEGMENTS, SUBTITLES.
    offloadJobs: []
    # Listener concurrency of the heavy handlers; empty = the server default.
    concurrency: ""

  # Extra env vars, e.g. CACHE_CLEANUP_CRON, HLS_MAX_CONCURRENT_FILES.
  extraEnv: []
  # Extra envFrom sources (ConfigMaps/Secrets with more settings).
  extraEnvFrom: []
  # Extra volumes and mounts for the server container.
  extraVolumes: []
  extraVolumeMounts: []
  podLabels: {}
  # A transcode killed mid-pass leaves a viewer without a stream; give it time to finish.
  terminationGracePeriodSeconds: 120
  priorityClassName: ""
  topologySpreadConstraints: []

  service:
    type: ClusterIP
    port: 8080
    # Only used with type NodePort / LoadBalancer. Empty = let Kubernetes pick.
    nodePort: null
    annotations: {}
    labels: {}
    loadBalancerIP: ""
    loadBalancerClass: ""
    externalTrafficPolicy: ""
    # On an IPv6-primary cluster a Service without these gets an IPv6-only ClusterIP.
    # The server listens dual-stack, so it needs nothing; see website.service.
    ipFamilyPolicy: ""
    ipFamilies: []

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  # Actuator lives on managementPort, outside the /api context path.
  # /actuator/health is always exposed; the liveness/readiness sub-groups are only
  # present when Spring detects Kubernetes, so they are not the default here.
  probes:
    enabled: true
    path: /actuator/health
    startup:
      failureThreshold: 30
      periodSeconds: 10
    liveness:
      periodSeconds: 20
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      failureThreshold: 3

  # Scratch space for transcoding. mountPath always sets TMP_DIR.
  tmp:
    mountPath: /tmp/ister
    # Back mountPath with a dedicated volume. Set false when mountPath already falls
    # inside one of the mediaVolumes below — otherwise this volume is mounted *over*
    # that path and shadows it, and transcodes silently land on the node's disk.
    enabled: true
    sizeLimit: 10Gi
    # An emptyDir is used unless an existingClaim is given.
    existingClaim: ""

  # Media libraries. Each maps to APP_ISTER_DISK_LIBRARIES_<i>_*.
  # type: SHOW | MOVIE | MUSIC | BOOK | PODCAST | COMIC
  libraries: []
  # - name: shows
  #   type: SHOW

  # Media volumes. Each entry is mounted into the server AND registered as
  # APP_ISTER_DISK_DIRECTORIES_<i>_*, unless library is omitted (mount only).
  # Exactly one source per entry: hostPath | existingClaim | nfs.
  # NOTE: no trailing slash on mountPath — the scanner skips the tree if there is one.
  mediaVolumes: []
  # - name: shows
  #   library: shows
  #   mountPath: /mnt/shows
  #   hostPath: /srv/media/shows
  #   hostPathType: Directory
  # - name: music
  #   library: music
  #   mountPath: /mnt/music
  #   existingClaim: media-music

# ============================================================
# Helper nodes: extra server pods that own no media but take the heavy job families
# (TRANSCODE, DETECT_SEGMENTS, SUBTITLES) for the main server's directories — for
# example one pod on the GPU node while the media sits on the NAS node. Each helper reads
# the source over HTTP from the main server and uploads results back to it, so it needs
# nothing but the same database, broker and search. It registers as node
# "<server.name> <helper.name>" in cluster server.clusterName.
# ============================================================
helpers: []
# - name: gpu
#   disks:
#     - name: shows           # a mediaVolumes[].name (= directory name) of the main server
#       jobs: [TRANSCODE]     # empty = jobs
#   jobs: []                  # default job set for the disks; empty = all three
#   concurrency: ""
#   hwaccel:                  # same shape as server.hwaccel
#     type: vaapi
#     resources: {gpu.intel.com/i915: 1}
#   resources: {}
#   nodeSelector: {}
#   tolerations: []
#   affinity: {}
#   # Scratch for transcodes and extractions: an emptyDir of this size, or an existing PVC.
#   cache:
#     sizeLimit: 20Gi
#     existingClaim: ""
#   extraEnv: []
#   podAnnotations: {}

# ============================================================
# Website (frontend)
# ============================================================
website:
  image:
    repository: ghcr.io/ister-app/player
    # Versioned independently of the server — see the note on server.image.tag.
    tag: "2.7.1"
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  # Extra env vars for the nginx that serves the player. CROSS_ORIGIN_ISOLATION=off
  # disables the COOP/COEP headers (player >= 2.8) if the app is embedded cross-origin.
  extraEnv: []
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
    annotations: {}
    labels: {}
    loadBalancerIP: ""
    loadBalancerClass: ""
    externalTrafficPolicy: ""
    # Player images before 2.8 listen on IPv4 only: on an IPv6-primary cluster set
    # ipFamilyPolicy: SingleStack and ipFamilies: [IPv4], or the Service gets an
    # IPv6-only ClusterIP and the ingress answers 503 while the pod is fine.
    ipFamilyPolicy: ""
    ipFamilies: []
  # Serve /.well-known/ister (the client discovery document: instance name, OIDC issuer,
  # API URL) from the website pod, as a file in nginx's html root. Works behind any
  # ingress controller or Gateway, and even through a plain port-forward — unlike the
  # ingress-nginx snippet in ingress.wellKnown, which this replaces.
  wellKnown:
    enabled: true
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  probes:
    enabled: true
    path: /

# ============================================================
# Cache PVC (server CACHE_DIR)
# ============================================================
cache:
  enabled: true
  # Use a pre-existing PVC instead of creating one.
  existingClaim: ""
  mountPath: /cache
  storageClass: ""
  size: 20Gi
  accessMode: ReadWriteOnce
  # Survive `helm uninstall`. Set false if you want the cache purged with the release.
  retain: true

# ============================================================
# Exposure. Pick one: an Ingress (any controller) or a Gateway API HTTPRoute.
#
# Whatever fronts ister has to allow three things the defaults of most proxies do not:
#   - unbounded request bodies: helper nodes POST whole HLS segments and subtitle files
#     to /api/transcode/upload and /api/cache/upload;
#   - long-running responses: HLS playback and /api/mediaFile/{id}/download (a helper
#     reading a multi-GB source with Range requests) run for minutes to hours;
#   - websocket upgrades on /api/graphql (GraphQL subscriptions).
# ingress.controller renders the annotations for that per controller; the HTTPRoute
# sets timeouts.request on the /api rule.
# ============================================================
ingress:
  enabled: false
  # Empty = the cluster's default IngressClass. (Was "nginx", which silently routed
  # nothing on clusters without that class — k3s/Traefik, most cloud providers.)
  className: ""
  # Annotation preset for the controller behind ingress.className:
  #   nginx   — ingress-nginx: proxy-body-size, proxy-read/send-timeout
  #   traefik — nothing needed: no body limit, timeouts live on the entrypoint
  #             (entryPoints.<name>.transport.respondingTimeouts); see the docs
  #   haproxy — haproxy-ingress: timeout-server / timeout-tunnel
  #   ""      — none; add your own under annotations
  controller: ""
  host: ""
  # Merged after the preset, so an entry here overrides it.
  annotations: {}
  proxy:
    # Request body limit for the preset, "0" = unlimited.
    bodySize: "0"
    # Read/send/tunnel timeout for the preset, in seconds.
    timeoutSeconds: 3600
  tls:
    enabled: true
    # Empty = "<host with dots replaced by dashes>-tls"
    secretName: ""
    # cert-manager ClusterIssuer. Empty = no cert-manager annotation.
    certIssuer: ""
  # Legacy: serve /.well-known/ister from an ingress-nginx server-snippet, which modern
  # ingress-nginx DISABLES by default (allow-snippet-annotations=false). Superseded by
  # website.wellKnown, which needs nothing from the controller.
  wellKnown:
    enabled: false

# Gateway API (gateway.networking.k8s.io/v1 HTTPRoute), for Envoy Gateway, Cilium,
# Istio, Traefik with the Gateway provider, ... The Gateway itself is yours: the chart
# only attaches a route to it, so the Gateway must allow routes from this namespace.
gateway:
  enabled: false
  # e.g. [ister.example.com]. The first one is also what server.url derives from.
  hostnames: []
  # e.g. [{name: public-gateway, namespace: default, sectionName: https-ister}]
  parentRefs: []
  annotations: {}
  # Whether the listener you attach to terminates TLS; only affects the advertised
  # server.url scheme (the certificate itself belongs to the Gateway).
  tls: true
  # Gateway API timeouts on the /api rule. 0s = none (Envoy Gateway's 15s default
  # cut helper downloads in half). Not every implementation honours them.
  apiTimeouts:
    request: 0s
    backendRequest: ""

# ============================================================
# Database
#   internal — a single postgres Deployment + PVC. Dev only, no backups.
#   cnpg     — a CloudNativePG Cluster. Requires the CNPG operator.
#   external — an existing PostgreSQL.
# All three end up behind one Secret with keys: host, port, dbname, user, password.
# ============================================================
database:
  mode: internal

  internal:
    image:
      repository: postgres
      tag: "18"
      pullPolicy: IfNotPresent
    dbName: ister
    user: ister
    # Provide via existingSecret in anything but a throwaway cluster.
    password: ""
    existingSecret: ""
    storageClass: ""
    storageSize: 8Gi
    retain: true
    # Use a pre-existing PVC for PGDATA instead of creating one.
    existingClaim: ""

    # Run as the image's own postgres user (uid 999). The entrypoint chmods
    # /var/run/postgresql and chowns PGDATA; as root with capabilities dropped those
    # calls fail with EPERM and the container crash-loops, so it must own them instead.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  cnpg:
    instances: 3
    imageName: ""
    dbName: ister
    user: ister
    storageClass: ""
    storageSize: 12Gi
    # Spread instances across nodes.
    enablePodAntiAffinity: true

    # Scrape the CNPG instances. The chart renders the PodMonitor itself; the operator's
    # own spec.monitoring.enablePodMonitor is deprecated and slated for removal.
    podMonitor:
      enabled: true
      interval: 30s
      # Extra labels so your Prometheus instance selects it.
      labels: {}
    parameters:
      pgaudit.log: "all, -misc"
      pgaudit.log_parameter: "on"
      pgaudit.log_relation: "on"
    resources: {}

    # Barman Cloud backups to S3-compatible storage.
    # Requires the barman-cloud CNPG plugin.
    backup:
      enabled: false
      destinationPath: ""       # e.g. s3://postgres-bucket/
      endpointURL: ""           # e.g. http://garage.example.com:3900
      region: ""
      walCompression: gzip
      # S3 credentials. Prefer existingSecret with keys:
      #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      existingSecret: ""
      accessKeyId: ""
      secretAccessKey: ""
      schedule:
        enabled: true
        # Six fields — CNPG cron includes seconds.
        cron: "0 0 3 * * *"
        backupOwnerReference: self

  external:
    host: ""
    port: 5432
    dbName: ister
    user: ister
    password: ""
    # Pre-existing Secret with keys: host, port, dbname, user, password.
    # For a CNPG cluster managed outside this chart, that is its <cluster>-app Secret.
    existingSecret: ""

# ============================================================
# RabbitMQ — a single-node StatefulSet on the official image (ister only uses the broker
# for pass-through work, so nothing here needs clustering).
# Set enabled: false to use externalRabbitmq instead.
# ============================================================
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "4.2.5-management-alpine"
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    username: user
    # Leave empty to generate one on install (preserved across upgrades). Only applied to
    # an empty data directory: changing it later means deleting the volume.
    password: ""
    # Pre-existing Secret with keys: rabbitmq-password, rabbitmq-erlang-cookie.
    existingSecret: ""
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    size: 8Gi
  # Extra env for rabbitmq itself, e.g. RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS.
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    annotations: {}
    # RabbitMQ listens on IPv4 only unless told otherwise: on an IPv6-primary cluster
    # set ipFamilyPolicy: SingleStack and ipFamilies: [IPv4].
    ipFamilyPolicy: ""
    ipFamilies: []
  # The image's own rabbitmq user (uid 999). OnRootMismatch keeps kubelet from
  # widening .erlang.cookie to 660 on every start, which RabbitMQ refuses.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  # No CPU limit: a limit only buys CFS throttling on a broker that idles at a few
  # millicores. Memory and ephemeral storage stay bounded.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

externalRabbitmq:
  host: ""
  # Rendered as SPRING_RABBITMQ_PORT.
  port: 5672
  user: user
  password: ""
  # Pre-existing Secret with key: rabbitmq-password
  existingSecret: ""

# ============================================================
# Typesense (search)
# ============================================================
typesense:
  enabled: true
  image:
    repository: docker.io/typesense/typesense
    tag: "30.2"
    pullPolicy: IfNotPresent
  port: 8108
  collection: media
  # Provide via existingSecret (key: api-key) outside of dev.
  apiKey: ""
  existingSecret: ""
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    size: 8Gi
    retain: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  service:
    annotations: {}
    # Typesense listens on IPv4 only: on an IPv6-primary cluster set
    # ipFamilyPolicy: SingleStack and ipFamilies: [IPv4].
    ipFamilyPolicy: ""
    ipFamilies: []

  # Used only when enabled: false.
  external:
    host: ""
    port: 8108
    protocol: http
    # Provide via existingSecret (key: api-key); apiKey is the --set escape hatch.
    apiKey: ""
    existingSecret: ""

# ============================================================
# Flyway migrations — an init container on the server pod, so the server can never
# start against an unmigrated schema. (A Helm pre-install hook cannot work here: in
# internal/cnpg mode the database is created by this same release, so the hook would
# wait for a database Helm has not created yet.)
# ============================================================
flyway:
  enabled: true
  image:
    repository: ghcr.io/ister-app/migrations
    # migrations publishes the same semver as the server, so it has no version line of its
    # own: an empty tag makes ister.image fall back to .Chart.AppVersion, which release.yml
    # derives from server.image.tag. Renovate bumping the server therefore bumps migrations
    # too — one source of truth, always in lockstep.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Image for the wait-for-db init container; needs pg_isready.
  # A {repository, tag} map rather than a "repo:tag" string, so Renovate tracks it too —
  # its helm-values manager only recognises the structured form.
  waitImage:
    repository: postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ============================================================
# Monitoring — Prometheus Operator ServiceMonitor
# ============================================================
monitoring:
  enabled: false
  # Extra labels so your Prometheus instance selects this ServiceMonitor.
  serviceMonitorLabels: {}
  interval: 30s

# ============================================================
# PodDisruptionBudgets
# ============================================================
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ============================================================
# `helm test` — the smoke-test Pod in templates/tests/.
# Here rather than hardcoded in the template so Renovate can track the image.
# ============================================================
tests:
  image:
    repository: curlimages/curl
    tag: "8.21.0"
    pullPolicy: IfNotPresent
