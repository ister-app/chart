name: CI

on:
  # No push trigger on purpose. Renovate fast-forwards main without a PR and without waiting
  # for checks (renovate.json), and its pushes are made with GITHUB_TOKEN, which never starts
  # a workflow anyway. Everything that lands on main is tested by the release instead, which
  # runs these jobs through workflow_call before it publishes anything — either right after a
  # Renovate merge (renovate.yml dispatches it) or on the nightly schedule.
  pull_request:
  workflow_dispatch:
  # release.yml runs these same jobs on the merged commit before it publishes anything,
  # so a chart can never be released on a red e2e.
  workflow_call:
  # So the server/player repos can re-run this after publishing new :main images.
  repository_dispatch:
    types: [images-published]
  schedule:
    # The dev/CI profiles deploy the mutable :main tags, and the kind + actions environment
    # moves under us regardless. Either can turn a green CI red without anyone touching this
    # repo, so catch it on a schedule rather than on the next release.
    - cron: "0 5 * * 1"

# A force-push to a PR branch should not leave another 35-minute e2e running against a SHA
# nobody will merge. event_name is part of the group so the workflow_call run from release.yml
# (also on main) never queues behind or cancels anything else.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v3.21.3

jobs:
  lint:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint every profile
        run: |
          helm lint . -f values-dev.yaml --set server.tmdbApiKey=x
          helm lint . -f values-production.example.yaml --set server.tmdbApiKey=x
          helm lint . -f ci/values-ci.yaml
          helm lint . -f ci/values-render-full.yaml

      - name: Render every profile
        run: |
          # values.schema.json and the template guards do the real work here; this just
          # makes sure each profile still produces parseable YAML.
          helm template ister . -f values-dev.yaml --set server.tmdbApiKey=x > /dev/null
          helm template ister . -f values-production.example.yaml --set server.tmdbApiKey=x > /dev/null
          helm template ister . -f ci/values-ci.yaml > /dev/null
          helm template ister . -f ci/values-ci.yaml -f ci/values-ingress-nginx.yaml > /dev/null
          helm template ister . -f ci/values-ci.yaml -f ci/values-gateway-envoy.yaml > /dev/null
          helm template ister . -f ci/values-upgrade-to.yaml > /dev/null
          # Typesense back on the image's IPv4-only default, the escape hatch for nodes
          # with IPv6 disabled in the kernel. The dual-stack default is what the e2e
          # below already runs.
          helm template ister . -f ci/values-ci.yaml --set typesense.apiAddress=0.0.0.0 > /dev/null
          # Both probe sets off, the escape hatch when a container listens on a family
          # kubelet does not probe.
          helm template ister . -f ci/values-ci.yaml \
            --set typesense.probes.enabled=false --set website.probes.enabled=false > /dev/null
          # All-external: no bundled datastores at all.
          helm template ister . \
            --set server.tmdbApiKey=x --set server.oidc.url=https://oidc.example/realms/a \
            --set database.mode=external --set database.external.host=pg \
            --set database.external.password=p \
            --set rabbitmq.enabled=false --set externalRabbitmq.host=rmq \
            --set externalRabbitmq.password=p \
            --set typesense.enabled=false --set typesense.external.host=ts \
            --set typesense.external.apiKey=k > /dev/null

      # kubeconform's image has no helm, so render on the runner first and hand the files
      # to the container's own /kubeconform entrypoint — piping helm *inside* the image
      # cannot work. The full profile carries every optional resource (HTTPRoute, helper
      # pods, NetworkPolicies, ...); the CRD catalog supplies the Gateway API schema.
      - name: Render for schema validation
        run: |
          helm template ister . -f ci/values-ci.yaml > kubeconform-ci.yaml
          helm template ister . -f ci/values-render-full.yaml > kubeconform-full.yaml
          helm template ister . -f ci/values-ci.yaml -f ci/values-gateway-envoy.yaml > kubeconform-gateway.yaml

      - name: Validate rendered manifests against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:latest-alpine
        with:
          args: >-
            -strict -summary -ignore-missing-schemas
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            kubeconform-ci.yaml kubeconform-full.yaml kubeconform-gateway.yaml

      # Catches a broken VALUES marker or values.yaml drift on the PR instead of
      # letting it fail the release build.
      - name: Build the docs zip
        run: ./ci/build-docs.sh 0.0.0-ci

  e2e:
    name: End-to-end on kind (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full suite, reached through the chart's own NodePort Service, on kind's
          # current default Kubernetes and on the oldest one still worth caring about.
          - name: nodeport
            exposure: nodeport
            node_image: ""
            e2e_only: ""
          - name: nodeport-k8s-1.34
            exposure: nodeport
            node_image: kindest/node:v1.34.11
            e2e_only: ""
          # The exposure variants run the streaming scenario only: it is the one that
          # exercises what a proxy gets wrong (long responses, body sizes, the stream-token
          # query, playlist URIs), and the whole suite would cost 35 minutes per variant.
          - name: ingress-nginx
            exposure: ingress-nginx
            node_image: ""
            e2e_only: "30-*"
          - name: gateway-envoy
            exposure: gateway-envoy
            node_image: ""
            e2e_only: "30-*"
    steps:
      - uses: actions/checkout@v7
        with:
          path: chart

      # The media fixtures are not committed (testdata/.gitignore excludes *.mkv), so they
      # have to be generated with ffmpeg. That costs ~4.5 minutes, which is far too much to
      # pay on every run — so cache the result. The key covers both the generator script and
      # the testdata commit, so the fixtures are rebuilt exactly when either changes.
      - uses: actions/checkout@v7
        with:
          repository: ister-app/testdata
          path: testdata

      - name: Resolve the testdata revision (for the cache key)
        id: testdata
        run: echo "sha=$(git -C testdata rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore media fixtures
        id: fixtures
        uses: actions/cache@v6
        with:
          path: |
            testdata/node1/disk1
            testdata/podcast-feed
          key: fixtures-${{ steps.testdata.outputs.sha }}-${{ hashFiles('testdata/create_mkv.sh', 'testdata/create_books.sh', 'testdata/create_comics.sh', 'testdata/create_podcast_feed.sh') }}

      # Only on a cache miss — which also means ffmpeg is only installed when it is used.
      - name: Generate media fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg zip
          cd testdata
          # The generators walk every node*/disk* they find and encode a 3-minute video per
          # episode. The e2e only mounts node1/disk1, so drop the other nodes/disks rather
          # than spend minutes encoding video nothing will ever read.
          rm -rf node2 node1/disk2
          # create_mkv.sh runs without `set -e` and its exit status is simply that of its
          # last statement, so its exit code is no reliable success signal. Ignore it and
          # gate on the fixtures that actually got produced instead.
          ./create_mkv.sh || true
          ./create_books.sh
          ./create_comics.sh
          # The feed is served in-cluster by ci/podcast-feed.yaml under this name.
          ./create_podcast_feed.sh http://podcast-feed:8080
          count=$(find node1/disk1 -name '*.mkv' | wc -l)
          echo "generated $count mkv fixtures"
          [ "$count" -gt 0 ]
          [ -f podcast-feed/feed.xml ]
          [ "$(find node1/disk1/books -name '*.epub' | wc -l)" -gt 0 ]
          [ "$(find node1/disk1/comics -name '*.cbz' | wc -l)" -gt 0 ]

      - name: Show the fixtures
        run: |
          echo "cache hit: ${{ steps.fixtures.outputs.cache-hit == 'true' }}"
          echo "mkv files:  $(find testdata/node1/disk1 -name '*.mkv' | wc -l)"
          echo "epub files: $(find testdata/node1/disk1 -name '*.epub' | wc -l)"
          echo "cbz files:  $(find testdata/node1/disk1 -name '*.cbz' | wc -l)"

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # The container images (~1.5 GB in total, of which the native server image is ~690 MB)
      # are deliberately NOT cached. Restoring them from the Actions cache is about as slow
      # as pulling them from a registry the runner has a fast path to, and it would eat most
      # of the 10 GB cache budget that the fixtures actually benefit from.
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: chart/ci/kind-config.yaml
          cluster_name: ister
          node_image: ${{ matrix.node_image }}

      - name: Deploy the mock OIDC issuer, podcast feed server and external-API mock
        run: |
          kubectl create namespace ister
          kubectl apply -n ister -f chart/ci/mock-oidc.yaml
          kubectl apply -n ister -f chart/ci/podcast-feed.yaml
          kubectl apply -n ister -f chart/ci/mock-external.yaml
          kubectl wait -n ister --for=condition=Available deploy/mock-oidc deploy/podcast-feed deploy/mock-external --timeout=180s

      - name: Install the ${{ matrix.exposure }} controller
        if: matrix.exposure != 'nodeport'
        working-directory: chart
        run: NAMESPACE=ister ci/exposure/${{ matrix.exposure }}.sh

      - name: Install the chart
        working-directory: chart
        run: |
          extra=""
          [ "${{ matrix.exposure }}" = nodeport ] || extra="-f ci/values-${{ matrix.exposure }}.yaml"
          helm upgrade --install ister . -n ister -f ci/values-ci.yaml $extra --wait --timeout 15m

      - name: Wait for everything to be ready
        run: |
          kubectl wait -n ister --for=condition=Ready pod --all --timeout=10m
          kubectl get pods -n ister

      - name: helm test (unauthenticated smoke)
        run: helm test ister -n ister --logs

      # The variants reach the API the way a client would: through the controller, on the
      # hostname the chart advertises. ingress-nginx sits on kind's published host port
      # 8090; the Envoy Service is port-forwarded (kind has no LoadBalancer).
      - name: End-to-end (scan and index real media)
        working-directory: chart
        run: |
          case "${{ matrix.exposure }}" in
            ingress-nginx)
              export E2E_API_URL=http://ister.test:8090/api
              export E2E_CURL_ARGS="--resolve ister.test:8090:127.0.0.1" ;;
            gateway-envoy)
              ci/exposure/gateway-envoy-forward.sh ister &
              export E2E_API_URL=http://ister.test:8091/api
              export E2E_CURL_ARGS="--resolve ister.test:8091:127.0.0.1" ;;
          esac
          if [ -n "${{ matrix.e2e_only }}" ]; then
            # The scan has to run first or there is nothing to stream; the scenario
            # scripts are independent files, so run scan + the selected ones.
            E2E_ONLY="10-*" ./ci/e2e.sh ister ister
            E2E_ONLY="${{ matrix.e2e_only }}" ./ci/e2e.sh ister ister
          else
            ./ci/e2e.sh ister ister
          fi

      - name: Diagnostics
        if: failure()
        run: |
          echo "===== pods ====="
          kubectl get pods -n ister -o wide
          echo "===== events ====="
          kubectl get events -n ister --sort-by=.lastTimestamp | tail -40
          echo "===== describe not-ready pods ====="
          kubectl get pods -n ister -o name | while read -r p; do
            kubectl describe -n ister "$p" | sed -n '/Events:/,$p'
          done
          echo "===== logs (all containers, including init) ====="
          kubectl get pods -n ister -o name | while read -r p; do
            echo "----- $p"
            # --all-containers alone skips init containers, and the flyway/wait-for-db
            # init containers are exactly where a broken install shows itself.
            kubectl logs -n ister "$p" --all-containers --prefix --tail=100 || true
            for c in wait-for-db flyway; do
              kubectl logs -n ister "$p" -c "$c" --tail=50 2>/dev/null | sed "s/^/[$c] /" || true
            done
          done

  # A chart is only as good as its upgrade: install the previous release from ghcr, then
  # upgrade to the working tree the way an operator would (no media, bundled datastores).
  # This is where a renamed value, a changed Secret key or a selector change surfaces.
  upgrade:
    name: Upgrade from the previous release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Previous chart version
        id: prev
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')
          [ -n "$prev" ] || { echo "::notice::no previous tag, nothing to upgrade from"; exit 0; }
          echo "version=$prev" >> "$GITHUB_OUTPUT"

      - name: Create kind cluster
        if: steps.prev.outputs.version != ''
        uses: helm/kind-action@v1
        with:
          cluster_name: ister-upgrade

      - name: Install the previous release
        if: steps.prev.outputs.version != ''
        run: |
          kubectl create namespace ister
          kubectl apply -n ister -f ci/mock-oidc.yaml
          kubectl wait -n ister --for=condition=Available deploy/mock-oidc --timeout=180s
          helm install ister oci://ghcr.io/ister-app/charts/ister \
            --version ${{ steps.prev.outputs.version }} -n ister \
            -f ci/values-upgrade-from.yaml --wait --timeout 15m

      # Charts before 1.0 shipped RabbitMQ as the Bitnami subchart; its StatefulSet is not
      # adopted (the queues hold pass-through work only), so it goes the way the docs say.
      - name: Upgrade to this chart
        if: steps.prev.outputs.version != ''
        run: |
          kubectl delete -n ister statefulset,service,pvc -l app.kubernetes.io/name=rabbitmq --ignore-not-found
          helm upgrade ister . -n ister -f ci/values-upgrade-to.yaml --wait --timeout 15m
          kubectl wait -n ister --for=condition=Ready pod --all --timeout=10m
          helm test ister -n ister --logs

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -n ister -o wide
          kubectl get events -n ister --sort-by=.lastTimestamp | tail -40
          kubectl get pods -n ister -o name | while read -r p; do
            echo "----- $p"
            kubectl logs -n ister "$p" --all-containers --prefix --tail=100 || true
          done
