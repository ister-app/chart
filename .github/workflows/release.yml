name: Release

# Collect everything that landed on main since the previous tag: bump Chart.yaml, package,
# push to ghcr as an OCI artifact, tag, and cut a GitHub Release with notes built from the
# commits. No schedule of its own: renovate.yml dispatches this once a day, after it has
# waited for the server and player releases and merged their bumps — so a night on which
# both released is one chart version, not two. A human can run it from the Actions tab as
# well. Either way the full CI runs first.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = derived from the commits since the last tag)
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      force:
        description: Release even if nothing shippable changed since the last tag
        type: boolean
        default: true

# Two releases racing would fight over the tag and the main commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # commit the bump, push the tag, create the release
  packages: write   # helm push to ghcr

jobs:
  # Most days there is nothing to ship. Rather than tag an identical chart every day, look
  # at what changed since the previous tag — the same set of paths that used to be the push
  # filter. This also makes the workflow self-guarding: its own `chore(release):` commit
  # touches Chart.yaml, but the tag sits on that commit, so the diff below is empty.
  # renovate.yml passes force=false; the button in the Actions tab defaults to true.
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [ "${{ inputs.force }}" = true ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::released on request"
            exit 0
          fi

          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          # No tag yet: this is the first release, and everything counts.
          changed=$(git diff --name-only ${prev:+"$prev"..}HEAD -- \
            Chart.yaml values.yaml values.schema.json templates doc)

          if [ -n "$changed" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::releasing, changed since ${prev:-the root commit}: $(tr '\n' ' ' <<<"$changed")"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing to release since ${prev:-the root commit}"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [changes, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and full history: the bump level and the release notes are both derived
          # from the commits since the previous tag.
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          # Same major as ci.yml's HELM_VERSION: the chart is linted and e2e-tested with
          # helm 3, so it is packaged with helm 3. A helm 4 bump is a PR, not an automerge.
          version: v3.21.4

      - name: Work out the new chart version
        id: version
        run: |
          current=$(yq -r .version Chart.yaml)
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range="${prev:+$prev..}HEAD"

          bump="${{ inputs.bump || 'auto' }}"
          if [ "$bump" = auto ]; then
            log=$(git log --no-merges --pretty='%s%n%b' "$range")
            if grep -qP '^[a-z]+(\(.+\))?!:|^BREAKING[ -]CHANGE' <<<"$log"; then
              bump=major
            elif grep -qP '^feat(\(.+\))?:' <<<"$log"; then
              bump=minor
            else
              # Renovate's image bumps land here (fix(deps):), as does anything unlabelled.
              bump=patch
            fi
          fi

          next=$(awk -F. -v b="$bump" '{
            if (b == "major")      printf "%d.0.0\n", $1 + 1
            else if (b == "minor") printf "%d.%d.0\n", $1, $2 + 1
            else                   printf "%d.%d.%d\n", $1, $2, $3 + 1
          }' <<<"$current")

          echo "prev=$prev"    >> "$GITHUB_OUTPUT"
          echo "bump=$bump"    >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "::notice::$current -> $next ($bump, since ${prev:-the root commit})"

      - name: Bump Chart.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # appVersion follows the server image: it is what app.kubernetes.io/version ends up
          # meaning on the pods. The website and migrations images have their own version
          # lines and are reported in the release notes instead.
          app=$(python3 -c 'import yaml; print(yaml.safe_load(open("values.yaml"))["server"]["image"]["tag"])')

          # sed, not `yq -i`: yq round-trips the comments but drops every blank line, so each
          # release would reflow the whole file. Only top-level keys sit at column 0 here, so
          # the anchors cannot hit the subchart's own `version:` under dependencies.
          sed -i -E "s|^version: .*|version: ${VERSION}|" Chart.yaml
          sed -i -E "s|^appVersion: .*|appVersion: \"${app}\"|" Chart.yaml

          # A silently non-matching sed would publish the old version under a new tag.
          grep -qx "version: ${VERSION}" Chart.yaml || { echo "version not written" >&2; exit 1; }
          grep -qx "appVersion: \"${app}\"" Chart.yaml || { echo "appVersion not written" >&2; exit 1; }
          git --no-pager diff Chart.yaml

      - name: Generate release notes
        run: ./ci/release-notes.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.prev }}"

      # doc/ with the values reference filled in from values.yaml; attached to the
      # release below, mirroring the player repo's docs zip.
      - name: Build the docs zip
        run: ./ci/build-docs.sh "${{ steps.version.outputs.version }}"

      - name: Package
        run: |
          helm package .

      - name: Push the chart to ghcr
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          helm push "ister-${VERSION}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Commit, tag and release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Chart.yaml CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"

          # main first, the tag second, as two pushes. Done in one push, a rejected main
          # (someone pushed while CI ran) still leaves the tag behind, on a commit that is
          # on no branch — and the next release, computing its version from the tags on
          # main, then trips over the existing tag name. Annotated, so that the GitHub
          # Release and `git describe` see it.
          git push origin HEAD:main
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

          gh release create "v${VERSION}" "ister-${VERSION}.tgz" "ister-chart-docs-${VERSION}.zip" \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md
