# Values for the kind-based e2e test. Not an example to copy — it is tuned for a
# 2-core / 7 GB GitHub runner and points at the mock OIDC issuer from ci/mock-oidc.yaml.

server:
  name: ci
  tmdbApiKey: mock-key   # ci/mock-external.yaml accepts any key
  oidc:
    # Must match the `iss` claim the mock issuer mints — see ci/mock-oidc.yaml.
    url: http://mock-oidc:8080/default

  # Every external metadata source is served by ci/mock-external.yaml, so enrichment is
  # deterministic and needs no internet. Each service lives under its own path prefix.
  externalServices:
    tmdbApiUrl: http://mock-external:8080/tmdb
    tmdbImageBase: http://mock-external:8080/img/tmdb
    musicbrainzBase: http://mock-external:8080/musicbrainz
    coverArtReleaseBase: http://mock-external:8080/img/coverart/release
    coverArtReleaseGroupBase: http://mock-external:8080/img/coverart/release-group
    commonsFilepathBase: http://mock-external:8080/img/commons/
    openLibraryBase: http://mock-external:8080/openlibrary
    openLibraryCoversBase: http://mock-external:8080/img/olcovers/
    openLibraryAuthorPhotoBase: http://mock-external:8080/img/olauthor/
    wikidataEntityBase: http://mock-external:8080/wikidata/entity/
    wikidataApiBase: http://mock-external:8080/wikidata/api
    wikipediaSummaryTemplate: http://mock-external:8080/wikipedia/{lang}/summary/{title}
    itunesBase: http://mock-external:8080/itunes

  # server.url is deliberately NOT set: the default (http://localhost:8080/api) is what
  # /.well-known/ister advertises, and that is exactly where the player integration
  # tests reach the server through `kubectl port-forward ... 8080:8080`.

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 3Gi

  # Give the native image room to boot on a slow runner before liveness starts killing it.
  probes:
    startup:
      failureThreshold: 60
      periodSeconds: 5

  libraries:
    - name: shows
      type: SHOW
    - name: movies
      type: MOVIE
    - name: music
      type: MUSIC
    - name: books
      type: BOOK
    - name: comics
      type: COMIC
    # Podcast episodes are downloaded into the cache PVC, so no mediaVolume is needed.
    - name: podcasts
      type: PODCAST

  # /testdata is mounted into the kind node by ci/kind-config.yaml.
  mediaVolumes:
    - name: tv
      library: shows
      mountPath: /media/tv
      hostPath: /testdata/node1/disk1/tv
    - name: movies
      library: movies
      mountPath: /media/movies
      hostPath: /testdata/node1/disk1/movies
    - name: music
      library: music
      mountPath: /media/music
      hostPath: /testdata/node1/disk1/music
    - name: books
      library: books
      mountPath: /media/books
      hostPath: /testdata/node1/disk1/books
    - name: comics
      library: comics
      mountPath: /media/comics
      hostPath: /testdata/node1/disk1/comics

  # The e2e reaches the API through the node port published by ci/kind-config.yaml
  # (30080 -> :8080); kubectl port-forward collapses under HLS traffic.
  service:
    type: NodePort
    nodePort: 30080

website:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

cache:
  # HLS transcode output + downloaded podcast episodes both land here.
  size: 2Gi
  retain: false

ingress:
  enabled: false

database:
  mode: internal
  internal:
    storageSize: 1Gi
    retain: false
    # 1Gi, not the chart default's 512Mi: the player's doc tour got postgres
    # OOMKilled (exit 137, cgroup limit) at that size — three CI hangs in a row
    # on 2026-09-02/04, each with the database restarting the second the album
    # page fired its queries, on top of the segment-detection writes still
    # running from the scan. The probe widening (f7a03fa) covered the *slow*
    # database; this covers the one the kernel kills. A GitHub runner has 16 GB.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi

rabbitmq:
  enabled: true
  persistence:
    enabled: false

typesense:
  enabled: true
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

flyway:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

monitoring:
  enabled: false
