# NodePort for the mock OIDC issuer, published on the host by ci/kind-config.yaml's
# extraPortMappings (30081 -> :18081). The server's own node port (30080 -> :8080)
# is the chart's server.service in ci/values-ci.yaml.
#
# Why not `kubectl port-forward`: the tunnel is a single SPDY stream through the
# API server and it collapses under the HLS traffic the player tests generate — the
# forward keeps running while requests start timing out ("error creating error
# stream ... Timeout occurred"), which surfaced as the player hanging on a
# GraphQL call and never starting playback.
apiVersion: v1
kind: Service
metadata:
  name: mock-oidc-nodeport
  labels:
    app.kubernetes.io/managed-by: ci
spec:
  type: NodePort
  selector:
    app: mock-oidc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
