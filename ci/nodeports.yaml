# NodePorts for the player integration tests, published on the host by
# ci/kind-config.yaml's extraPortMappings (30080 -> :8080, 30081 -> :18081).
#
# Why not `kubectl port-forward`: the tunnel is a single SPDY stream through the
# API server and it collapses under the HLS traffic those tests generate — the
# forward keeps running while requests start timing out ("error creating error
# stream ... Timeout occurred"), which surfaced as the player hanging on a
# GraphQL call and never starting playback.
#
# Separate Services rather than a patch on the chart's own: patching a
# helm-managed object makes the next `helm upgrade` fail on a field-manager
# conflict.
apiVersion: v1
kind: Service
metadata:
  name: ister-server-nodeport
  labels:
    app.kubernetes.io/managed-by: ci
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ister
    app.kubernetes.io/instance: ister
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oidc-nodeport
  labels:
    app.kubernetes.io/managed-by: ci
spec:
  type: NodePort
  selector:
    app: mock-oidc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
