apiVersion: v1
kind: Service
metadata:
  name: {{ include "ister.fullname" . }}-server
  labels:
    {{- include "ister.labels" (dict "ctx" . "component" "server") | nindent 4 }}
    {{- with .Values.server.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "ister.serviceSpec" .Values.server.service | nindent 2 }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      {{- with .Values.server.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
    # Actuator. Kept on the same Service; the ServiceMonitor scrapes this port only.
    - name: monitor
      port: {{ .Values.server.managementPort }}
      targetPort: monitor
  selector:
    {{- include "ister.selectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}
---
